# Local development stack. Copy .env.example to .env first (see README).
# Host ports bind to 127.0.0.1 only, so nothing is exposed to your network.
name: ryucloud

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ryucloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ryucloud}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local development. The browser uploads
  # straight to this service; AWS S3 replaces it later with configuration only.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      # Browsers upload cross-origin (page on :3000, storage on :9000), so MinIO must
      # allow the app's origins. MinIO has no per-bucket CORS API; this is its setting.
      MINIO_API_CORS_ALLOW_ORIGIN: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once per `up`: creates the private bucket and the least-privilege app user.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-ryucloud-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      ENVIRONMENT: development
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://${POSTGRES_USER:-ryucloud}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ryucloud}?sslmode=disable
      # Separate database used (and wiped) by `go test`; created automatically on first run.
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-ryucloud}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ryucloud}_test?sslmode=disable
      COOKIE_SECURE: "false" # local HTTP only; must be true behind HTTPS
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Object storage. S3_ENDPOINT is how the API reaches MinIO on the Docker network;
      # S3_PUBLIC_ENDPOINT is what the *browser* uses, so presigned URLs must point at it.
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_HOST_PORT:-9000}
      S3_REGION: us-east-1
      S3_USE_PATH_STYLE: "true"
      S3_BUCKET: ${S3_BUCKET:-ryucloud-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-1073741824}
      UPLOAD_URL_TTL_MINUTES: ${UPLOAD_URL_TTL_MINUTES:-30}
    volumes:
      - ./backend:/src
      # Go module and build caches survive container restarts.
      - gomodcache:/go/pkg/mod
      - gobuildcache:/home/app/.cache/go-build
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # `go run` compiles on start; the first build after a cache wipe is slow.
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      target: dev
      network: host
      entitlements:
        - network.host
    environment:
      API_PROXY_TARGET: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      # Keep dependencies and build output inside the container.
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  miniodata:
  gomodcache:
  gobuildcache:
